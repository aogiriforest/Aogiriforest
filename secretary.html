<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AOgiri Forest | AI秘書</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f5f7f3;color:#24352c;margin:0}main{max-width:680px;margin:auto;padding:24px 18px}header{padding:16px 0}small{color:#587263}h1{font-size:27px;margin:8px 0}.card{background:white;padding:22px;border-radius:18px;box-shadow:0 4px 20px #1c352012;margin:18px 0}label{font-weight:700;display:block;margin-bottom:12px}textarea{box-sizing:border-box;width:100%;height:150px;font:17px/1.5 inherit;padding:14px;border:1px solid #a7b7ab;border-radius:12px;resize:vertical}button{background:#215d43;color:white;border:0;border-radius:12px;padding:15px 20px;font-size:16px;font-weight:700;width:100%;margin-top:12px}button:disabled{opacity:.5}.note{font-size:13px;color:#59695e;line-height:1.7}.item{border-top:1px solid #ddd;padding:13px 0;white-space:pre-wrap;overflow-wrap:anywhere}.pill{display:inline-block;background:#e7f1ea;border-radius:20px;padding:4px 9px;font-size:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.secondary{background:#eef3ef;color:#244c36;width:auto;padding:9px;font-size:13px}#result{font-weight:700;color:#215d43;min-height:22px}</style></head><body><main><header><small>AOgiri Forest AI本部 · 試作版</small><h1>AI秘書｜指示受付</h1><p>まずは代表の指示を受け付け、端末内に記録する窓口です。</p></header><section class="card"><label for="task">AI秘書への指示</label><textarea id="task" placeholder="例：ヴィーガン市場の最新動向を調べて、要点をまとめて"></textarea><button id="send">指示を受け付ける</button><p id="result" role="status" aria-live="polite"></p><p class="note">※この試作版は、指示をこの端末のブラウザ内に保存するだけです。AIへの送信、部門への自動振り分け、調査の実行はまだ行いません。個人情報・取引先情報・機密情報は入力しないでください。</p></section><section class="card"><div class="row"><h2>受付履歴</h2><button class="secondary" id="export">履歴を保存</button></div><div id="list"></div></section></main><script>const key='aogiri-secretary-mvp-v1';const task=document.querySelector('#task'),result=document.querySelector('#result'),list=document.querySelector('#list');function load(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}function render(){let items=load();list.replaceChildren();if(!items.length){list.textContent='まだ指示はありません。';return}for(const x of items){let d=document.createElement('div');d.className='item';let s=document.createElement('span');s.className='pill';s.textContent='受付済み・未実行';let p=document.createElement('p');p.textContent=x.text;let t=document.createElement('small');t.textContent=new Date(x.at).toLocaleString('ja-JP')+' ｜ '+x.id;d.append(s,p,t);list.append(d)}}document.querySelector('#send').onclick=()=>{const v=task.value.trim();if(!v){result.textContent='指示を入力してください。';return}const items=load();items.unshift({id:'AF-'+Date.now(),at:new Date().toISOString(),text:v});try{localStorage.setItem(key,JSON.stringify(items))}catch{result.textContent='保存できませんでした。ブラウザの保存設定を確認してください。';return}task.value='';result.textContent='受け付けたよ。端末内に記録しました（作業は未実行）。';render()};document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aogiri-secretary-history.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
